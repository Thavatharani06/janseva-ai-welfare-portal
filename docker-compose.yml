version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: janseva_postgres
    environment:
      POSTGRES_DB: janseva_db
      POSTGRES_USER: janseva_user
      POSTGRES_PASSWORD: janseva_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janseva_user -d janseva_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: janseva_redis
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    container_name: janseva_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: janseva_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./legal_welfare.db
      - SECRET_KEY=janseva-production-secret-key-2026
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - postgres
      - redis
      - ollama
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/downloads:/app/downloads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: janseva_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
